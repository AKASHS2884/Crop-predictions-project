<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CropAdvisor" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="AI-powered crop yield prediction and farming recommendations for Tamil Nadu farmers" />
    <meta name="keywords" content="agriculture, farming, crop prediction, AI, Tamil Nadu, yield forecasting" />
    
    <title>Smart Crop Advisor - AI Farming Assistant</title>
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #16a34a, #059669);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Prevent zoom on mobile */
      input, select, textarea {
        font-size: 16px !important;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DQfM-QiR.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/charts-IZJuP_Aw.js">
    <link rel="modulepreload" crossorigin href="/assets/pdf-DGkRoZxH.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CZkf98bI.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div style="font-size: 4rem; margin-bottom: 20px;">🌾</div>
      <div class="loading-spinner"></div>
      <h2 style="margin: 0; font-weight: bold;">Smart Crop Advisor</h2>
      <p style="margin: 10px 0 0 0; opacity: 0.9;">Loading AI farming assistant...</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Hide loading screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
    
  </body>
</html>
